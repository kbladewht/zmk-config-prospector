# Prospector Scanner v2.2.1
# Default: Non-touch mode (display-only). Set CONFIG_PROSPECTOR_TOUCH_ENABLED=y for swipe navigation.
# To select startup layout without touch: CONFIG_PROSPECTOR_DEFAULT_LAYOUT=2 (0=YADS, 1=Field, 2=Operator, 3=Radii, 4=YADS2)

# ============== Display Configuration ==============
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL memory pool
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# Reduce screen flickering with double buffering
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_SIZE=30

# Display thread stack
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# FPU context sharing between threads (prevents FPU register corruption on context switch)
CONFIG_FPU_SHARING=y

# GPIO for backlight
CONFIG_GPIO=y

# ============== LVGL Widgets ==============
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMAGE=y

# Widgets for settings screens (compiled but not used in non-touch mode)
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_BUTTON=y

# ============== Fonts ==============
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_16=y

# ============== Scanner Mode ==============
# CONFIG_BT=y
CONFIG_BT_OBSERVER=y
# 我要使用dongle 模式不需要scanner
CONFIG_PROSPECTOR_MODE_SCANNER=n

# Touch disabled (display-only mode)
CONFIG_PROSPECTOR_TOUCH_ENABLED=n

# Layer slide animation (default: disabled, works in both touch and non-touch modes)
# To enable slide animation by default: CONFIG_PROSPECTOR_LAYER_SLIDE_DEFAULT=y

# ============== PWM Backlight ==============
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Stack overflow detection (writes sentinel at stack bottom, checks on context switch)
# CONFIG_STACK_SENTINEL=y

# ============== Disable Optional Features ==============
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n

# Battery and light sensor disabled by default
# To enable: CONFIG_PROSPECTOR_BATTERY_SUPPORT=y
# To enable: CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y
CONFIG_I2C=y
CONFIG_PROSPECTOR_DEFAULT_LAYOUT=4

# CONFIG_PROSPECTOR_DEMO_MODE=y
CONFIG_PROSPECTOR_MODE_SCANNER=y
CONFIG_PROSPECTOR_BATTERY_SUPPORT=y
CONFIG_ZMK_BLE=n

# 注意：ZMK 把“电池上报”的默认开启挂在 ZMK_BLE 上（zmk/app/Kconfig 里
# ZMK_BLE 的 `imply ZMK_BATTERY_REPORTING`），所以关掉蓝牙后电池上报会一起
# 变成 n（src/battery.c 不参与编译），屏幕上就没有电量了。
# 这里显式打开：它只读 DTS 里的 zmk,battery-voltage-divider，不依赖蓝牙。
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_PROSPECTOR_MAX_KEYBOARDS=2